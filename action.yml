name: Webhook Deploy
description: Trigger a deploy webhook with an optional HMAC-SHA256 signature

author: arodu

inputs:
  url:
    description: Full webhook URL
    required: true
  secret:
    description: Optional HMAC secret. If empty, no signature header is sent.
    required: false
  event:
    description: Value for the X-GitHub-Event header
    required: false
    default: push
  method:
    description: HTTP method to use
    required: false
    default: POST

runs:
  using: composite
  steps:
    - name: Send webhook
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.url }}
        WEBHOOK_SECRET: ${{ inputs.secret }}
        WEBHOOK_EVENT: ${{ inputs.event }}
        WEBHOOK_METHOD: ${{ inputs.method }}
        PAYLOAD: ${{ toJSON(github.event) }}
      run: |
        set -euo pipefail

        if [ -z "${WEBHOOK_URL}" ]; then
          echo "Missing input: url" >&2
          exit 1
        fi

        METHOD=$(printf '%s' "${WEBHOOK_METHOD:-POST}" | tr '[:lower:]' '[:upper:]')
        CURL_ARGS=(
          -fsS
          --retry 2
          --retry-delay 2
          --max-time 30
          -X "${METHOD}"
          "${WEBHOOK_URL}"
          -H "X-GitHub-Event: ${WEBHOOK_EVENT}"
        )

        if [ "${METHOD}" != "GET" ] && [ "${METHOD}" != "HEAD" ]; then
          CURL_ARGS+=(
            -H "Content-Type: application/json"
            -d "$PAYLOAD"
          )
        fi

        if [ -n "${WEBHOOK_SECRET}" ]; then
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
          CURL_ARGS+=(-H "X-Hub-Signature-256: sha256=${SIG}")
        fi

        curl "${CURL_ARGS[@]}"
        echo
