name: Webhook Deploy
description: Trigger a deploy webhook with an optional HMAC-SHA256 signature

author: arodu

inputs:
  url:
    description: Full webhook URL
    required: true
  secret:
    description: Optional HMAC secret. If empty, no signature header is sent.
    required: false
  content-type:
    description: application/json or application/x-www-form-urlencoded
    required: false
    default: application/json

runs:
  using: composite
  steps:
    - name: Send webhook
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.url }}
        WEBHOOK_SECRET: ${{ inputs.secret }}
        WEBHOOK_CONTENT_TYPE: ${{ inputs['content-type'] }}
        PAYLOAD: ${{ toJSON(github.event) }}
      run: |
        set -euo pipefail

        if [ -z "${WEBHOOK_URL}" ]; then
          echo "Missing input: url" >&2
          exit 1
        fi

        CONTENT_TYPE="${WEBHOOK_CONTENT_TYPE:-application/json}"

        BODY="$PAYLOAD"
        if [ "${CONTENT_TYPE}" = "application/x-www-form-urlencoded" ]; then
          BODY="payload=$(printf '%s' "$PAYLOAD" | jq -sRr @uri)"
        fi

        CURL_ARGS=(
          -fsS
          --retry 2
          --retry-delay 2
          --max-time 30
          -X POST
          "${WEBHOOK_URL}"
          -H "X-GitHub-Event: push"
          -H "Content-Type: ${CONTENT_TYPE}"
          --data-binary "$BODY"
        )

        if [ -n "${WEBHOOK_SECRET}" ]; then
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
          CURL_ARGS+=(-H "X-Hub-Signature-256: sha256=${SIG}")
        fi

        curl "${CURL_ARGS[@]}"
        echo
