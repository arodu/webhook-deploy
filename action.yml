name: Webhook Deploy
description: Trigger a deploy webhook signed with HMAC-SHA256

author: arodu

inputs:
  url:
    description: Base URL of the webhook server
    required: true
  path:
    description: Webhook path, for example hooks/my-app
    required: true
  secret:
    description: HMAC secret used to sign the payload
    required: true
  event:
    description: Value for the X-GitHub-Event header
    required: false
    default: push

runs:
  using: composite
  steps:
    - name: Send webhook
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.url }}
        WEBHOOK_PATH: ${{ inputs.path }}
        WEBHOOK_SECRET: ${{ inputs.secret }}
        WEBHOOK_EVENT: ${{ inputs.event }}
        PAYLOAD: ${{ toJSON(github.event) }}
      run: |
        set -euo pipefail

        if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_PATH}" ] || [ -z "${WEBHOOK_SECRET}" ]; then
          echo "Missing inputs: url, path or secret" >&2
          exit 1
        fi

        BASE="${WEBHOOK_URL%/}"
        PATH_PART="${WEBHOOK_PATH#/}"
        ENDPOINT="${BASE}/${PATH_PART}"
        SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')

        curl -fsS --retry 2 --retry-delay 2 --max-time 30 \
          -X POST "${ENDPOINT}" \
          -H "X-GitHub-Event: ${WEBHOOK_EVENT}" \
          -H "X-Hub-Signature-256: sha256=${SIG}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD"
        echo
